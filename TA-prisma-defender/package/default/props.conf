#
# Snapshot events; the event time is the collection time set by the modular
# input. record_type is one of: defender, defenders_summary,
# registry_scan_progress, registry_scan_statistics.
#

[prisma:defender]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
KV_MODE = json
DATETIME_CONFIG = CURRENT
category = Network & Security
pulldown_type = true
description = Prisma Cloud Compute Defenders and registry scan progress
EVAL-vendor = "Palo Alto Networks"
EVAL-product = "Prisma Cloud Compute"
EVAL-vendor_product = "Palo Alto Networks Prisma Cloud Compute"

# Add-on internal logs
[source::...ta_prisma_defender*.log*]
sourcetype = ta_prisma_defender:log
SHOULD_LINEMERGE = true
