#
# Event time is set by the modular input from AUDIT_INSERT_TIME / TIMESTAMP
# (epoch ms). The TIME_* settings below are a fallback for replayed data.
#

[cortex:audit:management_logs]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
TIME_PREFIX = "AUDIT_INSERT_TIME":\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 16
category = Network & Security
pulldown_type = true
description = Palo Alto Cortex audit management logs
EVAL-vendor = "Palo Alto Networks"
EVAL-product = "Cortex"
EVAL-vendor_product = "Palo Alto Networks Cortex"
EVAL-app = "cortex"
FIELDALIAS-cortex_mgmt_user = AUDIT_OWNER_EMAIL AS user AUDIT_OWNER_NAME AS user_name
FIELDALIAS-cortex_mgmt_src = AUDIT_SOURCE_IP AS src
FIELDALIAS-cortex_mgmt_misc = AUDIT_USER_AGENT AS http_user_agent AUDIT_SESSION_ID AS session_id AUDIT_ID AS id
EVAL-dest = coalesce(nullif(AUDIT_HOSTNAME, ""), "cortex")
EVAL-action = case(upper(AUDIT_RESULT)=="SUCCESS", "success", match(upper(AUDIT_RESULT), "^FAIL"), "failure", true(), lower(AUDIT_RESULT))
EVAL-status = lower(AUDIT_RESULT)
EVAL-severity = lower(replace(AUDIT_SEVERITY, "^SEV_\d+_", ""))
EVAL-object_category = lower(AUDIT_ENTITY)
EVAL-signature = AUDIT_ENTITY . ":" . AUDIT_ENTITY_SUBTYPE

[cortex:audit:agent_reports]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
TIME_PREFIX = "TIMESTAMP":\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 16
category = Network & Security
pulldown_type = true
description = Palo Alto Cortex agent audit reports
EVAL-vendor = "Palo Alto Networks"
EVAL-product = "Cortex"
EVAL-vendor_product = "Palo Alto Networks Cortex"
FIELDALIAS-cortex_agent_dest = ENDPOINTNAME AS dest ENDPOINTID AS dest_id DOMAIN AS dest_nt_domain
EVAL-status = lower(RESULT)
EVAL-signature = TYPE . ":" . SUBTYPE

# Add-on internal logs
[source::...ta_palo_alto_cortex_audit_logs*.log*]
sourcetype = ta_palo_alto_cortex_audit_logs:log
SHOULD_LINEMERGE = true
