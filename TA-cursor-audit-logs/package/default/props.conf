#
# One event per Cursor audit log record. Event time is "timestamp" (RFC 3339),
# set by the modular input; the TIME_* settings below are a fallback for
# replayed data, or for events streamed by Cursor to HEC with this sourcetype.
# Fields: event_id, timestamp, ip_address, user_email, event_type,
# application_type, event_data{...}.
#

[cursor:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
category = Application
pulldown_type = true
description = Cursor Admin API audit logs

EVAL-vendor = "Cursor"
EVAL-product = "Cursor"
EVAL-vendor_product = "Cursor"
EVAL-app = "cursor"
EVAL-dest = "cursor"
EVAL-user = user_email
EVAL-src = ip_address
EVAL-signature = event_type
EVAL-command = event_type
EVAL-object = coalesce('event_data.user_email', 'event_data.email', 'event_data.name', 'event_data.key_name', 'event_data.setting')
EVAL-object_category = case(match(event_type, "(?i)api_key|service_account|token"), "api_key", match(event_type, "(?i)user|member|role|invite|group|sso|domain"), "user", true(), "setting")
EVAL-status = "success"
# Failed sign-ins are not logged by Cursor, so logins are successes.
EVAL-action = case(match(event_type, "^(login|logout|sign_in|sign_out)$"), "success", match(event_type, "(?i)^(add|create|invite)_|_(added|created|invited)$"), "created", match(event_type, "(?i)^(remove|delete|revoke|disable)_|_(removed|deleted|revoked|disabled)$"), "deleted", true(), "modified")
EVAL-change_type = case(match(event_type, "^(login|logout|sign_in|sign_out)$"), null(), match(event_type, "(?i)api_key|service_account|token|user|member|role|invite|group|sso|domain"), "AAA", true(), "application")

# Add-on internal logs
[source::...ta_cursor_audit_logs*.log*]
sourcetype = ta_cursor_audit_logs:log
SHOULD_LINEMERGE = true
