[cursor_audit]
search = sourcetype="cursor:audit"
description = All Cursor audit events

[cursor_audit_authentication]
search = sourcetype="cursor:audit" (event_type="login" OR event_type="logout" OR event_type="sign_in" OR event_type="sign_out")
description = Cursor sign-ins and sign-outs (CIM Authentication)

[cursor_audit_change]
search = sourcetype="cursor:audit" NOT (event_type="login" OR event_type="logout" OR event_type="sign_in" OR event_type="sign_out")
description = Cursor membership, API key, settings and integration changes (CIM Change)

[cursor_audit_account_change]
search = sourcetype="cursor:audit" NOT (event_type="login" OR event_type="logout" OR event_type="sign_in" OR event_type="sign_out") (event_type="*user*" OR event_type="*member*" OR event_type="*role*" OR event_type="*api_key*" OR event_type="*service_account*" OR event_type="*invite*" OR event_type="*group*")
description = Cursor member, role, API key and service account changes (CIM Change, account)
