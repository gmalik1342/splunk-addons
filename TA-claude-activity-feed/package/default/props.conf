#
# One event per Activity Feed record. Event time is created_at (RFC 3339), set
# by the modular input; the TIME_* settings below are a fallback for replayed
# data. Actor fields depend on actor.type (user_actor, api_actor,
# admin_api_key_actor, unauthenticated_user_actor, anthropic_actor,
# system_actor, scim_directory_sync_actor).
#

[anthropic:claude:activity]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
TIME_PREFIX = "created_at":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Application
pulldown_type = true
description = Anthropic Claude Compliance API Activity Feed

EVAL-vendor = "Anthropic"
EVAL-product = "Claude"
EVAL-vendor_product = "Anthropic Claude"
EVAL-app = "Claude"
EVAL-signature = type
EVAL-actor_type = 'actor.type'
EVAL-user = coalesce('actor.email_address', 'actor.unauthenticated_email_address', 'actor.user_id', 'actor.api_key_id', 'actor.admin_api_key_id', 'actor.service')
EVAL-user_id = 'actor.user_id'
EVAL-src = 'actor.ip_address'
EVAL-http_user_agent = 'actor.user_agent'

# Add-on internal logs
[source::...ta_claude_activity_feed*.log*]
sourcetype = ta_claude_activity_feed:log
SHOULD_LINEMERGE = true
