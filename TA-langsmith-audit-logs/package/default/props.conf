#
# One event per LangSmith audit record, in OCSF v1.7 API Activity format
# (class_uid 6003). Event time is OCSF "time" (epoch ms), set by the modular
# input; the TIME_* settings below are a fallback for replayed data.
# The original LangSmith record is under unmapped.original_audit_log.
#

[langsmith:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
TIME_PREFIX = "time":\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 16
category = Application
pulldown_type = true
description = LangSmith audit logs (OCSF API Activity)

EVAL-vendor = "LangChain"
EVAL-product = "LangSmith"
EVAL-vendor_product = "LangChain LangSmith"
EVAL-app = "langsmith"
EVAL-dest = coalesce('unmapped.original_audit_log.organization_id', "langsmith")
EVAL-workspace_id = 'unmapped.original_audit_log.workspace_id'
EVAL-user = coalesce('actor.user.uid', 'actor.user.credential_uid')
EVAL-user_id = 'actor.user.uid'
EVAL-credential_id = 'actor.user.credential_uid'
EVAL-src = 'src_endpoint.ip'
EVAL-signature = 'api.operation'
EVAL-command = 'api.operation'
EVAL-http_method = 'http_request.http_method'
EVAL-uri_path = 'http_request.url.path'
EVAL-response_code = 'http_response.code'
EVAL-object_id = 'resources{}.uid'
EVAL-object = mvindex('resources{}.uid', 0)
EVAL-status = case(lower(status)=="success", "success", lower(status)=="failure", "failure", true(), lower(status))
EVAL-object_category = case(match('api.operation', "api_key|access_token|service_key|service_account|scim_token"), "api_key", match('api.operation', "role|org_member|_user|users_|sso|login|scim_|access_polic|member"), "user", match('api.operation', "workspace|organization|tenant"), "organization", true(), "resource")
EVAL-action = case('api.operation'=="login" AND lower(status)=="success", "success", 'api.operation'=="login", "failure", match('api.operation', "^(create|add|invite|mint|register|clone|upsert)_"), "created", match('api.operation', "^(delete|bulk_delete|remove|revoke|unshare|cancel)_"), "deleted", match('api.operation', "^(get|list|read|query|batch_query|stream|download|export)_"), "read", true(), "modified")
EVAL-change_type = case('api.operation'=="login", null(), match('api.operation', "api_key|access_token|service_key|service_account|scim_|role|org_member|_user|users_|sso|login_methods|access_polic|member"), "AAA", true(), "application")

# Add-on internal logs
[source::...ta_langsmith_audit_logs*.log*]
sourcetype = ta_langsmith_audit_logs:log
SHOULD_LINEMERGE = true
