[langsmith_audit]
search = sourcetype="langsmith:audit"
description = All LangSmith audit events

[langsmith_audit_authentication]
search = sourcetype="langsmith:audit" "api.operation"="login"
description = LangSmith logins (CIM Authentication)

[langsmith_audit_change]
search = sourcetype="langsmith:audit" ("api.operation"="create_*" OR "api.operation"="add_*" OR "api.operation"="invite_*" OR "api.operation"="mint_*" OR "api.operation"="register_*" OR "api.operation"="clone_*" OR "api.operation"="upsert_*" OR "api.operation"="update_*" OR "api.operation"="set_*" OR "api.operation"="attach_*" OR "api.operation"="share_*" OR "api.operation"="delete_*" OR "api.operation"="bulk_delete_*" OR "api.operation"="remove_*" OR "api.operation"="revoke_*" OR "api.operation"="unshare_*" OR "api.operation"="cancel_*")
description = LangSmith configuration and resource changes (CIM Change)

[langsmith_audit_account_change]
search = sourcetype="langsmith:audit" ("api.operation"="create_*" OR "api.operation"="add_*" OR "api.operation"="invite_*" OR "api.operation"="mint_*" OR "api.operation"="register_*" OR "api.operation"="clone_*" OR "api.operation"="upsert_*" OR "api.operation"="update_*" OR "api.operation"="set_*" OR "api.operation"="attach_*" OR "api.operation"="share_*" OR "api.operation"="delete_*" OR "api.operation"="bulk_delete_*" OR "api.operation"="remove_*" OR "api.operation"="revoke_*" OR "api.operation"="unshare_*" OR "api.operation"="cancel_*") ("api.operation"="*api_key*" OR "api.operation"="*access_token*" OR "api.operation"="*service_key*" OR "api.operation"="*service_account*" OR "api.operation"="*scim_*" OR "api.operation"="*role*" OR "api.operation"="*member*" OR "api.operation"="*sso*" OR "api.operation"="*login_methods*" OR "api.operation"="*basic_auth*" OR "api.operation"="*access_polic*")
description = LangSmith API key, role, member, SSO and SCIM changes (CIM Change, account)
