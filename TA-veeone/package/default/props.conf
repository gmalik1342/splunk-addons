#
# One event per specialist record. Event time is the snapshot time set by the
# modular input; every record from the same run shares it.
#

[veeone:logs]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
DATETIME_CONFIG = CURRENT
category = Application
pulldown_type = true
description = VeeOne specialist stats snapshot
EVAL-vendor = "VeeOne"
EVAL-product = "VeeOne"
EVAL-vendor_product = "VeeOne"

# Add-on internal logs
[source::...ta_veeone*.log*]
sourcetype = ta_veeone:log
SHOULD_LINEMERGE = true
