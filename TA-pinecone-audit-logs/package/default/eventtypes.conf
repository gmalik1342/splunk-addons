[pinecone_audit]
search = sourcetype="pinecone:audit"
description = All Pinecone audit events

[pinecone_audit_authentication]
search = sourcetype="pinecone:audit" "event.action"="login"
description = Pinecone console logins (CIM Authentication)

[pinecone_audit_change]
search = sourcetype="pinecone:audit" ("event.action"="create" OR "event.action"="update" OR "event.action"="delete")
description = Pinecone configuration changes (CIM Change)

[pinecone_audit_account_change]
search = sourcetype="pinecone:audit" ("event.resource_type"="user" OR "event.resource_type"="api-key") ("event.action"="create" OR "event.action"="update" OR "event.action"="delete")
description = Pinecone member and API key changes (CIM Change, account)
