#
# Pinecone audit logs.
#
# Pinecone writes audit logs as JSON files to the customer's bucket every
# 30 minutes. Collect them with the Splunk Add-on for AWS (Generic S3 input,
# sourcetype = pinecone:audit); see README.txt.
#
# Event breaking (index time, so this add-on must also be installed where the
# S3 input runs) handles:
#   * one JSON object per line (NDJSON),
#   * a JSON array with one object per line,
#   * a JSON array on a single line ([{...},{...}]). A new record starts at a
#     "{" whose first key is "actor" or whose top-level keys (before any
#     nested object) include "organization_id"; nested objects inside
#     event.parameters therefore do not split an event.
# Pretty-printed (multi-line) objects are not supported.
#

[pinecone:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\s,\[\]]*[\r\n][\s,\[\]]*|\s*,\s*(?=\{\s*(?:"actor"\s*:|[^{}]*"organization_id"\s*:)))
SEDCMD-pinecone_strip_array_open = s/^[\s\[]+//
SEDCMD-pinecone_strip_array_close = s/[\s\]]+$//
TRANSFORMS-pinecone_drop_non_events = pinecone_drop_non_events
TRUNCATE = 100000
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 30
KV_MODE = json
category = Network & Security
pulldown_type = true
description = Pinecone organization audit logs (JSON)

# Common fields
EVAL-vendor = "Pinecone"
EVAL-product = "Pinecone"
EVAL-vendor_product = "Pinecone"
EVAL-app = "pinecone"
EVAL-dest = coalesce('organization_name', 'organization_id', "pinecone")
EVAL-user = coalesce('actor.principal_name', 'actor.principal_id')
EVAL-user_id = 'actor.principal_id'
EVAL-actor_type = 'actor.principal_type'
EVAL-http_user_agent = 'client.userAgent'
EVAL-object = 'event.resource_name'
EVAL-object_id = 'event.resource_id'
EVAL-object_category = 'event.resource_type'
EVAL-command = 'event.action'
EVAL-result = 'event.outcome.result'
EVAL-status = case(lower('event.outcome.result')=="success", "success", lower('event.outcome.result')=="failure", "failure", true(), lower('event.outcome.result'))
EVAL-reason = coalesce('event.outcome.reason', 'event.outcome.error_code')
EVAL-signature = coalesce('event.resource_type', "unknown") . ":" . coalesce('event.action', "unknown")

# CIM Authentication (login) and Change (create/update/delete)
EVAL-action = case('event.action'=="login" AND lower('event.outcome.result')=="success", "success", 'event.action'=="login", "failure", 'event.action'=="create", "created", 'event.action'=="update", "modified", 'event.action'=="delete", "deleted", true(), lower('event.action'))
EVAL-change_type = case('event.action'=="login", null(), 'event.resource_type'=="user" OR 'event.resource_type'=="api-key", "AAA", true(), "application")
