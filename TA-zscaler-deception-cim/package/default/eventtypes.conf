[zscaler_deception_events]
search = sourcetype="zscaler:deception:events"
description = All Zscaler Deception decoy events

[zscaler_deception_detection]
search = sourcetype="zscaler:deception:events" NOT whitelisted=true
description = Zscaler Deception decoy events that are not whitelisted (CIM Intrusion Detection and Alerts)

[zscaler_deception_whitelisted]
search = sourcetype="zscaler:deception:events" whitelisted=true
description = Zscaler Deception events from whitelisted sources (not mapped to the CIM)

[zscaler_deception_audit]
search = sourcetype="zscaler:deception:audit"
description = Zscaler Deception admin portal audit logs
