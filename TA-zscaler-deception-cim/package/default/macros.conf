# Used by the dashboard. If the Deception data is in an index that is not
# searched by default, change the definitions, for example
#   index=deception sourcetype="zscaler:deception:events"
[zscaler_deception_events]
definition = index=* sourcetype="zscaler:deception:events"
iseval = 0
description = Base search for Zscaler Deception decoy events

[zscaler_deception_audit]
definition = index=* sourcetype="zscaler:deception:audit"
iseval = 0
description = Base search for Zscaler Deception audit logs

# Leaves out events from whitelisted sources.
[zscaler_deception_not_whitelisted]
definition = NOT whitelisted=true
iseval = 0
description = Excludes whitelisted Zscaler Deception events
