#
# Zscaler Deception events and audit logs.
#
# Zscaler Deception sends its own data (Deception Admin Portal > Orchestrate >
# SIEM Integrations) either to a Splunk HTTP Event Collector token or to
# syslog. Set the HEC token's (or the syslog input's) sourcetype to
#   zscaler:deception:events   for "Events"
#   zscaler:deception:audit    for "Audit Logs"
# See README.txt.
#
# Each event is one JSON object with flat, dotted key names
# ("attacker.ip" is a single key, not a nested object). Over syslog the JSON
# follows an RFC 5424 or RFC 3164 header; the header is removed at index time
# so the stored event is pure JSON. Index-time settings apply where the data
# is first parsed (HEC receiver, heavy forwarder or indexer).
#
# This add-on does not change any setting of the official Zscaler add-on.
#

[zscaler:deception:events]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
SEDCMD-zscaler_deception_strip_syslog_header = s/^[^{]*\{/{/
TRANSFORMS-zscaler_deception_drop_non_json = zscaler_deception_drop_non_json
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 25
KV_MODE = json
category = Network & Security
pulldown_type = true
description = Zscaler Deception decoy events (JSON, HEC or syslog)

# Common fields
EVAL-vendor = "Zscaler"
EVAL-product = "Zscaler Deception"
EVAL-vendor_product = "Zscaler Deception"
EVAL-app = "Zscaler Deception"
EVAL-event_id = 'id'
EVAL-deception_type = lower('type')

# Attacker (source)
EVAL-src = coalesce('attacker.ip', 'attacker.name', 'attacker.id')
EVAL-src_ip = 'attacker.ip'
EVAL-src_host = if('attacker.name'!='attacker.ip', 'attacker.name', null())
EVAL-src_port = 'attacker.port'
EVAL-src_user = 'attacker.user'
EVAL-user = 'attacker.user'

# Decoy (destination)
EVAL-dest = coalesce('decoy.name', 'decoy.ip', 'decoy.id')
EVAL-dest_ip = 'decoy.ip'
EVAL-dest_category = 'decoy.group'
EVAL-decoy_type = 'decoy.type'

# CIM Intrusion Detection
# Decoys observe the activity; they do not block it.
EVAL-action = "allowed"
EVAL-signature = "Zscaler Deception " . coalesce(lower('type'), "unknown") . " activity"
EVAL-signature_id = lower('type')
EVAL-category = 'kill_chain_phase'
EVAL-severity = case(lower('severity')=="critical", "critical", lower('severity')=="high", "high", lower('severity')=="medium", "medium", lower('severity')=="low", "low", in(lower('severity'), "info", "informational"), "informational", true(), "unknown")
EVAL-ids_type = case(in(lower('type'), "endpoint", "itdr", "ransomware", "windows", "filetheft", "credtheft"), "host", in(lower('type'), "aws", "azure", "custom"), "application", true(), "network")
EVAL-risk_score = 'score'
EVAL-attacker_score = 'attacker.score'

# CIM Alerts and MITRE ATT&CK (multi-value)
EVAL-mitre_technique_id = 'mitre_ids{}'
EVAL-threat_parse_id = 'attacker.threat_parse_ids{}'
EVAL-description = "Zscaler Deception " . coalesce(lower('type'), "unknown") . " activity from " . coalesce('attacker.ip', 'attacker.name', "unknown") . " on decoy " . coalesce('decoy.name', 'decoy.ip', "unknown")

# Recon (web) detail
EVAL-http_method = 'recon.method'
EVAL-uri_path = 'recon.request_uri'
EVAL-status = 'recon.status'


[zscaler:deception:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
SEDCMD-zscaler_deception_strip_syslog_header = s/^[^{]*\{/{/
TRANSFORMS-zscaler_deception_drop_non_json = zscaler_deception_drop_non_json
MAX_TIMESTAMP_LOOKAHEAD = 128
KV_MODE = json
category = Network & Security
pulldown_type = true
description = Zscaler Deception admin portal audit logs (JSON, HEC or syslog)

EVAL-vendor = "Zscaler"
EVAL-product = "Zscaler Deception"
EVAL-vendor_product = "Zscaler Deception"
EVAL-app = "Zscaler Deception"
