#
# One event per alert. Event time is alertTimestamp (epoch ms), set by the
# modular input; the TIME_* settings below are a fallback for replayed data.
# An alert is ingested again whenever it changes (e.g. status New -> Resolved),
# so use latest(status) BY id for its current state.
#

[netapp:cloud_secure:alerts]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
TIME_PREFIX = "alertTimestamp":\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 16
category = Network & Security
pulldown_type = true
description = NetApp Cloud Insights Workload Security (Cloud Secure) alerts

# CIM: Alerts
EVAL-vendor = "NetApp"
EVAL-product = "Cloud Insights Workload Security"
EVAL-vendor_product = "NetApp Cloud Insights Workload Security"
EVAL-app = "NetApp Cloud Insights Workload Security"
EVAL-type = "alert"
FIELDALIAS-cloud_secure_user = userName AS user
FIELDALIAS-cloud_secure_signature = alertType AS signature
EVAL-description = alertType
EVAL-severity = case(lower(severity)=="critical", "critical", lower(severity)=="high", "high", lower(severity)=="warning", "medium", lower(severity)=="medium", "medium", lower(severity)=="low", "low", match(lower(severity), "^info"), "informational", true(), lower(severity))
EVAL-vendor_severity = severity

# Add-on internal logs
[source::...ta_netapp_cloud_insights_secure*.log*]
sourcetype = ta_netapp_cloud_insights_secure:log
SHOULD_LINEMERGE = true
